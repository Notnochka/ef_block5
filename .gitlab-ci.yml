workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

stages:
  - test

variables:
  COMPOSER_ALLOW_SUPERUSER: 1

default:
  image: php:8.4-cli
  cache:
    key:
      files:
        - unit/composer.lock
    paths:
      - unit/vendor/

test:
  stage: test
  before_script:
    - apt-get update -qq && apt-get install -y -qq git unzip libzip-dev libsqlite3-dev
    - docker-php-ext-configure zip && docker-php-ext-install -j"$(nproc)" zip pdo_sqlite
    - curl -fsSL https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - cd "${CI_PROJECT_DIR}/unit" && composer install --prefer-dist --no-progress --no-interaction
    - mkdir -p "${CI_PROJECT_DIR}/unit/database"
  script:
    - cd "${CI_PROJECT_DIR}/unit" && ./vendor/bin/phpunit --configuration phpunit.xml
