name: Run Tests

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: unit/vendor
          key: ${{ runner.os }}-php-${{ hashFiles('unit/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        working-directory: unit
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare sqlite directory
        working-directory: unit
        run: mkdir -p database

      - name: Run PHPUnit
        working-directory: unit
        run: ./vendor/bin/phpunit --configuration phpunit.xml

  deploy-ssh:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ vars.RUN_DEPLOY == 'ssh' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.SSH_DEPLOY_PATH }}"
            git pull origin main
            composer install --working-dir=unit --no-dev --optimize-autoloader --no-interaction

  deploy-ftp:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ vars.RUN_DEPLOY == 'ftp' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite
          tools: composer

      - name: Install production dependencies (unit)
        working-directory: unit
        run: composer install --prefer-dist --no-progress --no-interaction --no-dev --optimize-autoloader

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./unit/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.phpunit.result.cache
            **/tests/**
            **/phpunit.xml
